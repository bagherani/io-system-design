services:
  nat:
    build:
      context: ./nat
    container_name: io-system-design-01-nat
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    depends_on:
      - server1
      - server2
      - server3
    environment:
      SERVER1_IP: 172.29.0.11
      SERVER2_IP: 172.29.0.12
      PRIVATE_SUBNET: 172.29.0.0/24
    networks:
      public_net:
      private_net:
        ipv4_address: 172.29.0.10
    ports:
      - "3020:81"
      - "3021:82"

  server1:
    image: node:22-alpine
    container_name: io-system-design-01-server1
    working_dir: /app
    volumes:
      - ../:/app:ro
    command: sh -c "apk add --no-cache curl >/dev/null && node 01-networking/apps/server1.js"
    networks:
      private_net:
        ipv4_address: 172.29.0.11

  server2:
    image: node:22-alpine
    container_name: io-system-design-01-server2
    working_dir: /app
    volumes:
      - ../:/app:ro
    command: sh -c "apk add --no-cache curl >/dev/null && node 01-networking/apps/server2.js"
    networks:
      private_net:
        ipv4_address: 172.29.0.12

  server3:
    image: node:22-alpine
    container_name: io-system-design-01-server3
    working_dir: /app
    volumes:
      - ../:/app:ro
    command: sh -c "apk add --no-cache curl >/dev/null && node 01-networking/apps/server3.js"
    networks:
      private_net:
        ipv4_address: 172.29.0.13

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
