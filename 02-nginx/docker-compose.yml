services:
  certgen:
    image: alpine/openssl:latest
    command:
      - req
      - -x509
      - -newkey
      - rsa:2048
      - -nodes
      - -sha256
      - -days
      - "30"
      - -subj
      - /CN=localhost/O=IO System Design
      - -addext
      - subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1
      - -keyout
      - /certs/nginx.key.pem
      - -out
      - /certs/nginx.crt.pem
    volumes:
      - nginx_certs:/certs

  app-one:
    build:
      context: ..
      dockerfile: 02-nginx/.Dockerfile
    image: io-system-design-nginx-demo-app:latest
    container_name: nginx-demo-app-1
    restart: unless-stopped
    environment:
      PORT: "3000"
      SERVER_NAME: replica-one
    ports:
      - "4101:3000"

  app-two:
    build:
      context: ..
      dockerfile: 02-nginx/.Dockerfile
    image: io-system-design-nginx-demo-app:latest
    container_name: nginx-demo-app-2
    restart: unless-stopped
    environment:
      PORT: "3000"
      SERVER_NAME: replica-two
    ports:
      - "4102:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-load-balancer
    restart: unless-stopped
    depends_on:
      certgen:
        condition: service_completed_successfully
      app-one:
        condition: service_started
      app-two:
        condition: service_started
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro

volumes:
  nginx_certs:
