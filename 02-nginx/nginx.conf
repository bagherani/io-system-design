events {}

http {
  upstream node_apps {
    # Nginx OSS uses passive health checks. One failed request removes the
    # replica from rotation for 10 seconds, then Nginx tries it again.
    server nginx-demo-app-1:3000 max_fails=1 fail_timeout=10s;
    server nginx-demo-app-2:3000 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://node_apps;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
