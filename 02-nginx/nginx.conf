events {}

http {
  upstream node_apps {
    # Load-balancing algorithms to try in class:
    # - Default is round-robin: each replica gets a turn.
    # - Weighted round-robin: higher weight gets proportionally more turns.
    # - least_conn; sends traffic to the replica with the fewest active requests.
    # - ip_hash; keeps the same client IP on the same replica when possible.
    # - hash $request_uri consistent; routes the same URL to the same replica.
    # - random two least_conn; picks two random replicas, then uses the less busy one.
    #
    # Uncomment one algorithm line at a time above the server lines.

    # Nginx OSS uses passive health checks. One failed request removes the
    # replica from rotation for 10 seconds, then Nginx tries it again.
    server nginx-demo-app-1:3000 weight=4 max_fails=1 fail_timeout=10s;
    server nginx-demo-app-2:3000 weight=1 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://node_apps;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }

  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/certs/nginx.crt.pem;
    ssl_certificate_key /etc/nginx/certs/nginx.key.pem;

    location / {
      proxy_pass http://node_apps;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
