services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: io-system-design-08-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 5s
      timeout: 5s
      retries: 20

  topic-setup:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      sh -c '
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic incidents --partitions 1 --replication-factor 1;
      '

  ingress:
    image: node:22-alpine
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ..:/app:ro
    environment:
      PORT: "3018"
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3018:3018"
    command: >
      sh -c '
        if [ ! -d node_modules/kafkajs ]; then
          echo "Run npm install from the repository root first.";
          exit 1;
        fi;
        node 08-eda/apps/ingress.js
      '

  app-2-email:
    image: node:22-alpine
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ..:/app:ro
    environment:
      SERVICE_NAME: app-2-email
      GROUP_ID: app-2-email
      TOPIC: orders
      KAFKA_BROKERS: kafka:9092
    command: node 08-eda/apps/consumer.js

  app-3-analytics:
    image: node:22-alpine
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ..:/app:ro
    environment:
      SERVICE_NAME: app-3-analytics
      GROUP_ID: app-3-analytics
      TOPIC: orders
      KAFKA_BROKERS: kafka:9092
    command: node 08-eda/apps/consumer.js

  app-4-support:
    image: node:22-alpine
    depends_on:
      topic-setup:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ..:/app:ro
    environment:
      SERVICE_NAME: app-4-support
      GROUP_ID: app-4-support
      TOPIC: incidents
      KAFKA_BROKERS: kafka:9092
    command: node 08-eda/apps/consumer.js
