# Nginx needs an events block even though this lesson does not customize it.
events {}

http {
	# An upstream groups the app instances that can handle each request.
	upstream counter_apps {
		# ROUND ROBIN is the default when no algorithm directive is present.
		# Requests take turns across app-1, app-2, and app-3.

		# LEAST CONNECTIONS sends traffic to the app with the fewest active requests.
		# Uncomment the next line to try it. Keep ip_hash commented.
		# least_conn;

		# IP HASH keeps requests from one client IP on the same app when possible.
		# Uncomment the next line to try it. Keep least_conn commented.
		# ip_hash;

		server app-1:3000;
		server app-2:3000;
		server app-3:3000;
	}

	# This is the public Nginx server exposed on localhost:3022 by Docker Compose.
	server {
		listen 80;

		location / {
			# Forward the original request to one app selected from counter_apps.
			proxy_pass http://counter_apps;
		}
	}
}
