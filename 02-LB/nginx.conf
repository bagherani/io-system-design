events {}

http {
  upstream node_apps {
    # Uncomment one algorithm at a time. Leave all commented for round-robin.
    # The server weights below make the default algorithm weighted round-robin;
    # set both weights to 1 for equal round-robin.
    # least_conn;
    # ip_hash;
    # hash $request_uri consistent;
    # random two least_conn;

    # Nginx OSS uses passive health checks. One failed request removes the
    # replica from rotation for 10 seconds, then Nginx tries it again.
    # Container names resolve only on this Docker network. For replicas on
    # another Mac, allow Docker through its firewall and use its stable LAN IP
    # with published ports, for example 192.168.1.50:4101 and :4102.

    # server 192.168.1.50:4101 weight=4 max_fails=1 fail_timeout=10s;
    server nginx-demo-app-1:3000 weight=2 max_fails=1 fail_timeout=10s;
    server nginx-demo-app-2:3000 weight=1 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://node_apps;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }

  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/certs/nginx.crt.pem;
    ssl_certificate_key /etc/nginx/certs/nginx.key.pem;

    location / {
      proxy_pass http://node_apps;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
