services:
  app-one:
    build:
      context: ..
      dockerfile: 01-rate-limiting/.Dockerfile
    image: io-system-design-rate-limiting-demo-app:latest
    container_name: rate-limiting-demo-app-1
    restart: unless-stopped
    environment:
      PORT: "3000"
      SERVER_NAME: app-one

  nginx:
    image: nginx:1.27-alpine
    container_name: rate-limiting-nginx
    restart: unless-stopped
    depends_on:
      app-one:
        condition: service_started
    ports:
      - "3019:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
